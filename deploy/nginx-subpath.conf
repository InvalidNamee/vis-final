# Build with ATLAS_BASE=/atlas/. Copy dist contents into /srv/www/atlas/.
server {
    listen 80;
    server_name _;
    root /srv/www;
    location = /atlas { return 301 /atlas/; }
    location /atlas/assets/ { try_files $uri =404; }
    location ~* ^/atlas/.*\.(?:js|css|json|png|jpg|jpeg|svg|gif|woff2?|map)$ {
        try_files $uri =404;
    }
    location /atlas/ { try_files $uri $uri/ /atlas/index.html; }
}
