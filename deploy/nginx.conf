# Replace /srv/atlas with the directory containing the built dist contents.
server {
    listen 80;
    server_name _;
    root /srv/atlas;
    index index.html;
    location /assets/ { try_files $uri =404; }
    location ~* \.(?:js|css|json|png|jpg|jpeg|svg|gif|woff2?|map)$ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
